# ==============================================================================
# GLOBAL AGENT CONFIGURATION
# ==============================================================================
[agent]
  ## Default data collection interval for all inputs
  interval = "15s"
  round_interval = true

  ## Telegraf will send metrics to outputs in batches of at most metric_batch_size metrics
  metric_batch_size = 1000
  metric_buffer_limit = 10000

  ## Collection jitter is used to prevent every plugin from firing at the exact same second
  collection_jitter = "0s"
  flush_interval = "15s"
  flush_jitter = "0s"

  ## Leave blank to automatically use the host's system hostname (e.g., debian1-UptimeKuma)
  hostname = ""
  omit_hostname = false

# ==============================================================================
# OUTPUT PLUGINS (PROMETHEUS)
# ==============================================================================
[[outputs.prometheus_client]]
  ## Address and port to listen on for Prometheus scraping
  listen = ":9273"

  ## Metric version 2 preserves Prometheus-friendly naming and labels
  metric_version = 2

  ## Path to publish metrics on
  path = "/metrics"

  ## Expiration interval for each metric (should be >= Prometheus scrape_interval)
  expiration_interval = "60s"

# ==============================================================================
# INPUT PLUGINS: HOST SYSTEM METRICS (Replaces Node Exporter)
# ==============================================================================

# Read metrics about CPU usage
[[inputs.cpu]]
  percpu = true
  totalcpu = true
  collect_cpu_time = false
  report_active = false

# Read metrics about memory usage
[[inputs.mem]]

# Read metrics about swap memory usage
[[inputs.swap]]

# Read metrics about disk usage by mount point
[[inputs.disk]]
  ## Ignore virtual and temporary filesystems
  ignore_fs = ["tmpfs", "devtmpfs", "devfs", "iso9660", "overlay", "aufs", "squashfs"]

# Read metrics about disk IO by device
[[inputs.diskio]]

# Read metrics about network interface usage
[[inputs.net]]
  ## Ignore virtual Docker bridge/veth interfaces to keep metrics clean
  ignore_protocol_stats = true

# Read metrics about system load, uptime, and logged-in users
[[inputs.system]]

# Read kernel statistics from /proc/stat
[[inputs.kernel]]

# Read processes count and states
[[inputs.processes]]

# ==============================================================================
# INPUT PLUGINS: DOCKER CONTAINER METRICS (Replaces cAdvisor)
# (Remove or comment out this block if Docker is not installed on this host)
# ==============================================================================
[[inputs.docker]]
  endpoint = "unix:///var/run/docker.sock"
  gather_services = false
  source_tag = false
  container_name_include = []
  container_name_exclude = []
  timeout = "15s"
  perdevice_include = ["cpu", "blkio", "network"]
  total_include = ["cpu", "blkio", "network"]

[[inputs.exec]]
  commands = ["/opt/telegraf/host_info.sh"]
  timeout = "10s"
  interval = "30s"
  data_format = "influx"
